version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_parking_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./smart_parking.db
      - SECRET_KEY=smart-parking-secret-key-super-secure-token-2026
      - RAZORPAY_KEY_ID=rzp_test_mockkey123
      - RAZORPAY_KEY_SECRET=rzp_secret_mockkey456
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./backend:/app

  redis:
    image: redis:7-alpine
    container_name: smart_parking_redis
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: smart_parking_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
